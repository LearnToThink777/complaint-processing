<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="search-title">
  <title id="search-title">지킴이 — 돋보기로 꼼꼼히 검토하는 모습</title>
  <defs>
    <linearGradient id="search-skin" x1="0.35" y1="0.02" x2="0.72" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#f8fafd"/><stop offset="100%" stop-color="#e3e9f2"/>
    </linearGradient>
    <radialGradient id="search-blush">
      <stop offset="0%" stop-color="#f4a3b4" stop-opacity="0.9"/><stop offset="100%" stop-color="#f4a3b4" stop-opacity="0"/>
    </radialGradient>
    <filter id="search-sh" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#16304f" flood-opacity="0.15"/>
    </filter>
    <g id="search-arm"><ellipse rx="12.5" ry="16.5" fill="url(#search-skin)" stroke="#dae1eb" stroke-width="1.6"/></g>
  </defs>

  <g filter="url(#search-sh)">
    <use href="#search-arm" x="42" y="132" transform="rotate(16 42 132)"/>

    <path d="M100 14C64 14 40 62 40 108c0 40 26 66 60 66s60-26 60-66c0-46-24-94-60-94Z"
          fill="url(#search-skin)" stroke="#dae1eb" stroke-width="1.8"/>
    <ellipse cx="100" cy="156" rx="38" ry="11" fill="#dbe3ed" opacity="0.35"/>
    <ellipse cx="75" cy="52" rx="16" ry="10" fill="#ffffff" opacity="0.95" transform="rotate(-26 75 52)"/>

    <ellipse cx="78" cy="98" rx="9.5" ry="12" fill="#1b2330"/>
    <ellipse cx="122" cy="98" rx="9.5" ry="12" fill="#1b2330"/>
    <circle cx="74.6" cy="93" r="3.4" fill="#ffffff"/>
    <circle cx="118.6" cy="93" r="3.4" fill="#ffffff"/>
    <circle cx="81.5" cy="103.5" r="1.7" fill="#ffffff" opacity="0.75"/>
    <circle cx="125.5" cy="103.5" r="1.7" fill="#ffffff" opacity="0.75"/>
    <ellipse cx="100" cy="108" rx="3" ry="2.2" fill="#cfd8e4"/>
    <path d="M86.5 116c6.5 3.4 20.5 3.4 27 0-0.5 15-6 20-13.5 20s-13-5-13.5-20Z" fill="#1b2330"/>
    <ellipse cx="59" cy="118" rx="10.5" ry="7" fill="url(#search-blush)"/>
    <ellipse cx="141" cy="118" rx="10.5" ry="7" fill="url(#search-blush)"/>

    <!-- 렌즈는 몸 바깥에 두고, 손잡이 끝을 손이 덮게 한다. -->
    <path d="M165 78 153 97" stroke="#93a4bb" stroke-width="8.5" stroke-linecap="round"/>
    <circle cx="175" cy="62" r="18.5" fill="#e8f0fe" fill-opacity="0.85" stroke="#2f6fed" stroke-width="6"/>
    <use href="#search-arm" x="155" y="104" transform="rotate(-36 155 104)"/>
  </g>
</svg>
