<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="wait-title">
  <title id="wait-title">지킴이 — 눈을 감고 기다리는 모습</title>
  <defs>
    <linearGradient id="wait-skin" x1="0.35" y1="0.02" x2="0.72" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#f8fafd"/><stop offset="100%" stop-color="#e3e9f2"/>
    </linearGradient>
    <radialGradient id="wait-blush">
      <stop offset="0%" stop-color="#f4a3b4" stop-opacity="0.9"/><stop offset="100%" stop-color="#f4a3b4" stop-opacity="0"/>
    </radialGradient>
    <filter id="wait-sh" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#16304f" flood-opacity="0.15"/>
    </filter>
    <g id="wait-arm"><ellipse rx="12.5" ry="16.5" fill="url(#wait-skin)" stroke="#dae1eb" stroke-width="1.6"/></g>
  </defs>

  <g filter="url(#wait-sh)">
    <use href="#wait-arm" x="42" y="132" transform="rotate(16 42 132)"/>
    <use href="#wait-arm" x="158" y="132" transform="rotate(-16 158 132)"/>

    <path d="M100 14C64 14 40 62 40 108c0 40 26 66 60 66s60-26 60-66c0-46-24-94-60-94Z"
          fill="url(#wait-skin)" stroke="#dae1eb" stroke-width="1.8"/>
    <ellipse cx="100" cy="156" rx="38" ry="11" fill="#dbe3ed" opacity="0.35"/>
    <ellipse cx="75" cy="52" rx="16" ry="10" fill="#ffffff" opacity="0.95" transform="rotate(-26 75 52)"/>

    <path d="M69 99c3.5-5.5 12-5.5 15.5 0" fill="none" stroke="#1b2330" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M115.5 99c3.5-5.5 12-5.5 15.5 0" fill="none" stroke="#1b2330" stroke-width="4.6" stroke-linecap="round"/>
    <path d="M92 119q8 8 16 0" fill="none" stroke="#1b2330" stroke-width="3.6" stroke-linecap="round"/>
    <ellipse cx="59" cy="118" rx="10.5" ry="7" fill="url(#wait-blush)"/>
    <ellipse cx="141" cy="118" rx="10.5" ry="7" fill="url(#wait-blush)"/>
  </g>

  <g fill="none" stroke="#93a4bb" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M158 44h13l-13 15h13" stroke-width="4"/>
    <path d="M176 22h9l-9 11h9" stroke-width="3.2"/>
  </g>
</svg>
