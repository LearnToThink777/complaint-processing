<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="shield-title">
  <title id="shield-title">지킴이 — 방패를 든 모습</title>
  <defs>
    <linearGradient id="shield-skin" x1="0.35" y1="0.02" x2="0.72" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#f8fafd"/><stop offset="100%" stop-color="#e3e9f2"/>
    </linearGradient>
    <linearGradient id="shield-plate" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#3fa9ba"/><stop offset="100%" stop-color="#1e7a8b"/>
    </linearGradient>
    <radialGradient id="shield-blush">
      <stop offset="0%" stop-color="#f4a3b4" stop-opacity="0.9"/><stop offset="100%" stop-color="#f4a3b4" stop-opacity="0"/>
    </radialGradient>
    <filter id="shield-sh" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#16304f" flood-opacity="0.15"/>
    </filter>
    <g id="shield-arm"><ellipse rx="12.5" ry="16.5" fill="url(#shield-skin)" stroke="#dae1eb" stroke-width="1.6"/></g>
  </defs>

  <g filter="url(#shield-sh)">
    <use href="#shield-arm" x="42" y="132" transform="rotate(16 42 132)"/>

    <path d="M100 14C64 14 40 62 40 108c0 40 26 66 60 66s60-26 60-66c0-46-24-94-60-94Z"
          fill="url(#shield-skin)" stroke="#dae1eb" stroke-width="1.8"/>
    <ellipse cx="100" cy="156" rx="38" ry="11" fill="#dbe3ed" opacity="0.35"/>
    <ellipse cx="75" cy="52" rx="16" ry="10" fill="#ffffff" opacity="0.95" transform="rotate(-26 75 52)"/>

    <ellipse cx="78" cy="98" rx="9.5" ry="12" fill="#1b2330"/>
    <ellipse cx="122" cy="98" rx="9.5" ry="12" fill="#1b2330"/>
    <circle cx="74.6" cy="93" r="3.4" fill="#ffffff"/>
    <circle cx="118.6" cy="93" r="3.4" fill="#ffffff"/>
    <circle cx="81.5" cy="103.5" r="1.7" fill="#ffffff" opacity="0.75"/>
    <circle cx="125.5" cy="103.5" r="1.7" fill="#ffffff" opacity="0.75"/>
    <ellipse cx="100" cy="108" rx="3" ry="2.2" fill="#cfd8e4"/>
    <path d="M86.5 116c6.5 3.4 20.5 3.4 27 0-0.5 15-6 20-13.5 20s-13-5-13.5-20Z" fill="#1b2330"/>
    <ellipse cx="59" cy="118" rx="10.5" ry="7" fill="url(#shield-blush)"/>
    <ellipse cx="141" cy="118" rx="10.5" ry="7" fill="url(#shield-blush)"/>

    <!-- 손 → 방패 순서. 방패가 손을 덮어야 '쥐고 있는' 것으로 읽힌다(반대면 몸을 뚫은 것처럼 보인다). -->
    <use href="#shield-arm" x="157" y="126" transform="rotate(-26 157 126)"/>
    <g transform="translate(136,131) scale(0.94)">
      <path d="M0-34 27-24.5v22C27 15 15 28.5 0 35.5-15 28.5-27 15-27-2.5v-22Z" fill="url(#shield-plate)"/>
      <path d="M0-34 27-24.5v22C27 15 15 28.5 0 35.5Z" fill="#000000" opacity="0.08"/>
      <path d="M-11.5 1.5-3.5 10.5 12.5-9.5" fill="none" stroke="#ffffff" stroke-width="6.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
