<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="docs-title">
  <title id="docs-title">지킴이 — 서류철을 들고 확인하는 모습</title>
  <defs>
    <linearGradient id="docs-skin" x1="0.35" y1="0.02" x2="0.72" y2="1">
      <stop offset="0%" stop-color="#ffffff"/><stop offset="55%" stop-color="#f8fafd"/><stop offset="100%" stop-color="#e3e9f2"/>
    </linearGradient>
    <radialGradient id="docs-blush">
      <stop offset="0%" stop-color="#f4a3b4" stop-opacity="0.9"/><stop offset="100%" stop-color="#f4a3b4" stop-opacity="0"/>
    </radialGradient>
    <filter id="docs-sh" x="-45%" y="-45%" width="190%" height="190%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#16304f" flood-opacity="0.15"/>
    </filter>
    <g id="docs-arm"><ellipse rx="12.5" ry="16.5" fill="url(#docs-skin)" stroke="#dae1eb" stroke-width="1.6"/></g>
  </defs>

  <g filter="url(#docs-sh)">
    <path d="M100 14C64 14 40 62 40 108c0 40 26 66 60 66s60-26 60-66c0-46-24-94-60-94Z"
          fill="url(#docs-skin)" stroke="#dae1eb" stroke-width="1.8"/>
    <ellipse cx="100" cy="156" rx="38" ry="11" fill="#dbe3ed" opacity="0.35"/>
    <ellipse cx="75" cy="52" rx="16" ry="10" fill="#ffffff" opacity="0.95" transform="rotate(-26 75 52)"/>

    <ellipse cx="78" cy="98" rx="9.5" ry="12" fill="#1b2330"/>
    <ellipse cx="122" cy="98" rx="9.5" ry="12" fill="#1b2330"/>
    <circle cx="74.6" cy="93" r="3.4" fill="#ffffff"/>
    <circle cx="118.6" cy="93" r="3.4" fill="#ffffff"/>
    <circle cx="81.5" cy="103.5" r="1.7" fill="#ffffff" opacity="0.75"/>
    <circle cx="125.5" cy="103.5" r="1.7" fill="#ffffff" opacity="0.75"/>
    <ellipse cx="100" cy="108" rx="3" ry="2.2" fill="#cfd8e4"/>
    <path d="M86.5 116c6.5 3.4 20.5 3.4 27 0-0.5 15-6 20-13.5 20s-13-5-13.5-20Z" fill="#1b2330"/>
    <ellipse cx="59" cy="118" rx="10.5" ry="7" fill="url(#docs-blush)"/>
    <ellipse cx="141" cy="118" rx="10.5" ry="7" fill="url(#docs-blush)"/>

    <!-- 두 손 → 서류철 순서. 서류철이 손끝을 덮고 팔은 옆으로 삐져나온다. -->
    <use href="#docs-arm" x="50" y="140" transform="rotate(30 50 140)"/>
    <use href="#docs-arm" x="150" y="140" transform="rotate(-30 150 140)"/>
    <g transform="translate(100,148)">
      <rect x="-38" y="-30" width="34" height="13" rx="5" fill="#eeb63c"/>
      <rect x="-38" y="-23" width="76" height="45" rx="7" fill="#f6c453" stroke="#e0a92e" stroke-width="1.8"/>
      <rect x="-26" y="-11" width="40" height="4.5" rx="2.2" fill="#ffffff" opacity="0.8"/>
      <rect x="-26" y="0" width="26" height="4.5" rx="2.2" fill="#ffffff" opacity="0.8"/>
    </g>
  </g>
</svg>
